<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INRGIFT — Global market intelligence from India (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --blue:#245BFE;--blue-ink:#1B46C9;--blue-soft:#EAF0FF;--navy:#071A33;--bg:#F7F9FC;--surface:#FFFFFF;--s2:#EEF2F7;
  --line:#E5EAF1;--line2:#D7DEE8;--text:#071A33;--muted:#4A5770;--faint:#6F7C93;--up:#0B7F56;--down:#C2352B;--warn:#9A6408;
  --saffron:#E8862A;--r:12px;--r-sm:8px;--side:248px;--side-c:64px;--hdr:64px;--ctl:36px;
  --fh:"Manrope","Inter",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 1px 2px rgba(7,26,51,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6A90FF;--blue-ink:#8FAcFF;--blue-soft:#14284D;--bg:#07111F;--surface:#0C1A2D;--s2:#12233A;--line:#1B2E48;--line2:#2A4163;
  --text:#EAF0FA;--muted:#A9B6CB;--faint:#8492AA;--up:#3CCB93;--down:#F27F74;--warn:#E0B050;--sh:none}}
:root[data-theme="dark"]{
  --blue:#6A90FF;--blue-ink:#8FACFF;--blue-soft:#14284D;--bg:#07111F;--surface:#0C1A2D;--s2:#12233A;--line:#1B2E48;--line2:#2A4163;
  --text:#EAF0FA;--muted:#A9B6CB;--faint:#8492AA;--up:#3CCB93;--down:#F27F74;--warn:#E0B050;--sh:none}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--hdr) + 40px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em;line-height:1.2}
h1{font-size:32px;font-weight:800}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:700}
p{margin:0}a{color:var(--blue-ink);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* demo strip */
.demo{background:var(--navy);color:#C9D5EA;font-size:12px;display:flex;gap:12px;align-items:center;padding:6px 20px;flex-wrap:wrap}
.demo b{color:#fff;font-weight:600}.demo select{background:#0F2747;color:#fff;border:1px solid #284063;border-radius:6px;padding:2px 6px;font-size:12px}
.demo .sp{flex:1}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--hdr);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 20px}
.logo{display:flex;align-items:center;gap:9px;font:800 18px var(--fh);color:var(--text);letter-spacing:.01em;margin-right:14px}
.logo:hover{text-decoration:none}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--blue);position:relative;display:block}
.logo i::before{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:50%}
.logo i::after{content:"";position:absolute;left:12px;top:4px;bottom:4px;width:2px;background:#fff}
.nav{display:flex;gap:2px}
.nav>a,.nav summary{padding:8px 11px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;list-style:none;display:block}
.nav summary::-webkit-details-marker{display:none}
.nav>a:hover,.nav summary:hover{background:var(--s2);color:var(--text);text-decoration:none}
.nav .on{color:var(--blue-ink);background:var(--blue-soft)}
details.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 12px 32px rgba(7,26,51,.14);padding:6px;z-index:40}
.menu.rt{left:auto;right:0}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--text);background:none;border:0;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--s2);text-decoration:none}.menu small{display:block;color:var(--faint)}
.srch{flex:1;max-width:440px;margin:0 auto;height:var(--ctl);display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--faint);cursor:pointer;min-width:0}
.srch span{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.srch:hover{border-color:var(--blue)}
kbd{font:500 11px var(--fb);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:var(--surface);color:var(--muted)}
.hr{display:flex;align-items:center;gap:6px}
.ib{height:var(--ctl);min-width:var(--ctl);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;background:none;cursor:pointer;color:var(--muted);padding:0 8px;position:relative;list-style:none}
.ib::-webkit-details-marker{display:none}.ib:hover{background:var(--s2);color:var(--text);text-decoration:none}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font:700 12px var(--fh);display:grid;place-items:center}
select.sel,input.inp,textarea.inp{height:var(--ctl);border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding:0 10px;max-width:100%}
textarea.inp{height:auto;padding:8px 10px;width:100%}input.inp:focus,select.sel:focus{border-color:var(--blue)}

/* shell */
.shell{display:flex;min-height:calc(100vh - var(--hdr))}
.side{width:var(--side);flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr));display:flex;flex-direction:column;padding:12px 10px;overflow:auto;transition:width .18s ease}
.side.c{width:var(--side-c)}
.side h4{font:600 11px var(--fb);color:var(--faint);margin:14px 10px 6px;letter-spacing:.02em}
.side.c h4{visibility:hidden;height:1px;margin:8px 0}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.side a:hover{background:var(--s2);color:var(--text);text-decoration:none}
.side a.on{background:var(--blue-soft);color:var(--blue-ink)}
.side a em{margin-left:auto;font-style:normal;font-size:11px;background:var(--s2);border-radius:20px;padding:1px 7px;color:var(--muted)}
.side a.on em{background:var(--surface)}.side a em.unread{background:var(--blue);color:#fff}
.side.c a span,.side.c a em,.side.c .who div{display:none}.side.c a{justify-content:center}
.side .bot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.who{display:flex;gap:10px;align-items:center;padding:8px 10px}
.main{flex:1;min-width:0;padding:22px 24px 80px}
.wrap{max-width:1320px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph p{color:var(--muted);margin-top:4px;max-width:70ch}
.crumbs{font-size:12px;color:var(--faint);margin-bottom:8px}.crumbs a{color:var(--muted)}

/* primitives */
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g13{grid-template-columns:300px minmax(0,1fr)}
.stack>*+*{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh h2{font-size:15px}.mh .sp{flex:1}.mb{padding:14px 16px}.mb.flush{padding:0}
.mf{padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}
.btn{height:var(--ctl);display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);text-decoration:none}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
:root .btn.p{color:#fff}.btn.p:hover{filter:brightness(1.07)}
.btn.s{height:28px;padding:0 9px;font-size:12px;border-radius:7px}.btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.btn.g{border-color:transparent;background:none;color:var(--muted)}.btn.g:hover{background:var(--s2)}
.seg{display:inline-flex;background:var(--s2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;background:var(--surface);cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--blue);text-decoration:none}.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--s2);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-LIVE{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.st-DELAYED{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}.st-DELAYED::before{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.st-EOD{color:var(--blue-ink);background:var(--blue-soft)}.st-EOD::before{border-radius:1px}
.st-CLOSED::before{background:none;border:1.5px solid currentColor}
.st-UNAVAILABLE::before{background:none;border:1.5px dashed currentColor}
.st-ERROR{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}.st-ERROR::before{border-radius:0;transform:rotate(45deg)}
.st-LOADING::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.sk{background:linear-gradient(90deg,var(--s2),var(--line),var(--s2));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:6px;height:14px;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.state{padding:28px 16px;text-align:center;color:var(--muted)}.state b{display:block;color:var(--text);font:700 15px var(--fh);margin-bottom:4px}.state .btn{margin-top:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.kv div{background:var(--surface);padding:10px 12px}.kv dt,.kv small{display:block;font-size:12px;color:var(--faint)}.kv b{font-size:15px;font-variant-numeric:tabular-nums}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface);text-align:right;font-weight:600;color:var(--faint);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th button{all:unset;cursor:pointer;color:inherit}.t th button:hover{color:var(--text)}.t th button:focus-visible{outline:2px solid var(--blue)}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.t tbody tr:hover td{background:var(--bg)}.t tr:last-child td{border-bottom:0}
.t td.l,.t th.l{text-align:left}
.as{display:flex;align-items:center;gap:10px;color:var(--text);min-width:150px}.as:hover{text-decoration:none}.as:hover b{color:var(--blue-ink)}
.as .tk{width:34px;height:34px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font:700 10px var(--fh);color:var(--muted);flex:none;overflow:hidden}
.as b{display:block;font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis}.as small{color:var(--faint);font-size:11px}
.ra{display:inline-flex;gap:2px}.ra button,.ra a{width:28px;height:28px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--faint);display:grid;place-items:center}
.ra button:hover,.ra a:hover{background:var(--s2);color:var(--blue-ink)}.ra .on{color:var(--blue)}.ra .on svg{fill:currentColor}
.best{background:var(--blue-soft)!important;font-weight:600}

/* home */
.hero{padding:26px 0 18px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:end}
.hero h1{font-size:40px;line-height:1.1}.hero p{color:var(--muted);font-size:16px;margin-top:8px}
.bigs{margin-top:16px;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--faint);cursor:pointer;width:100%;font-size:15px;text-align:left}
.bigs:hover{border-color:var(--blue)}.bigs span{flex:1}
.regions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.regions a{background:var(--surface);padding:10px 14px;color:var(--text)}.regions a:hover{background:var(--bg);text-decoration:none}
.regions b{display:block;font-weight:600}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.ix{flex:0 0 190px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;color:var(--text);display:block}
.ix:hover{border-color:var(--blue);text-decoration:none}.ix .v{font:700 17px var(--fh);font-variant-numeric:tabular-nums}
.ix .row{display:flex;justify-content:space-between;align-items:center;gap:6px}.ix svg{width:100%;height:30px;margin:4px 0}
/* session rail */
.rail{display:grid;grid-template-columns:150px 1fr 96px;gap:4px 12px;align-items:center;font-size:12px}
.rail .tr{position:relative;height:14px;background:var(--s2);border-radius:4px}
.rail .tr i{position:absolute;top:0;bottom:0;background:var(--line2);border-radius:4px}.rail .tr i.o{background:var(--blue)}
.rail .tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--saffron)}
.rail .ax{position:relative;height:16px;color:var(--faint);font-size:11px}.rail .ax span{position:absolute;transform:translateX(-50%)}
/* heatmap */
.hm{position:relative;width:100%;aspect-ratio:2/1;background:var(--s2);border-radius:var(--r-sm);overflow:hidden}
.hm.cmp{aspect-ratio:2.6/1}
.hg{position:absolute;border:2px solid var(--surface);overflow:hidden}
.hg>button{position:absolute;top:0;left:0;right:0;height:20px;border:0;background:var(--navy);color:#fff;font:600 11px var(--fb);text-align:left;padding:0 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hg>button:hover{background:var(--blue)}.hg>div{position:absolute;top:20px;left:0;right:0;bottom:0}
.ht{position:absolute;border:1px solid var(--surface);color:#fff;padding:3px 5px;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit}
.ht:hover,.ht.sel{outline:2px solid var(--text);outline-offset:-2px;z-index:2}.ht b{display:block;font:700 12px var(--fh)}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}.legend i{width:26px;height:10px;display:block;border-radius:2px}
/* bars */
.br{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.br .b{height:10px;background:var(--s2);border-radius:3px;position:relative}.br .b i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--blue)}
.br .b.dv::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--text)}
.tile:hover{border-color:var(--blue);text-decoration:none}.tile small{color:var(--faint);display:block;margin-top:2px}
.rc{display:block;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--text)}.rc:last-child{border-bottom:0}.rc:hover{background:var(--bg);text-decoration:none}
.rc b{display:block;font-weight:600}.rc small{color:var(--faint)}
.tag{display:inline-block;font-size:11px;background:var(--s2);color:var(--muted);border-radius:5px;padding:1px 6px;margin-right:4px}
/* chart */
.cbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.cro{font-size:12px;color:var(--muted);padding:8px 16px 0;min-height:26px;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto;cursor:crosshair}.chart text{font:11px var(--fb);fill:var(--faint)}
.fs{position:fixed;inset:0;z-index:60;border-radius:0;overflow:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
.tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue-ink);border-color:var(--blue);font-weight:600}
.px{font:800 34px var(--fh);font-variant-numeric:tabular-nums;line-height:1}
.prose p{max-width:72ch;color:var(--muted);margin-bottom:10px}.prose h3{margin:14px 0 4px}
.india{border-left:3px solid var(--saffron);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
/* screener */
.grp{border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--bg)}.grp .grp{background:var(--surface);margin-top:8px}
.grph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rule{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.rule select,.rule input{height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 8px}.rule input{width:90px}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(7,26,51,.45);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:9vh 16px 16px}
.pal{width:min(640px,100%);background:var(--surface);border-radius:14px;border:1px solid var(--line2);box-shadow:0 24px 64px rgba(7,26,51,.3);overflow:hidden;max-height:78vh;display:flex;flex-direction:column}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);height:54px;padding:0 18px;font-size:16px;background:none;outline:none}
.pal .res{overflow:auto;padding:6px}.pal h5{margin:8px 10px 4px;font:600 11px var(--fb);color:var(--faint)}
.pal a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--text)}.pal a.act,.pal a:hover{background:var(--blue-soft);text-decoration:none}
.pal a small{color:var(--faint);margin-left:auto;white-space:nowrap}
.modal{width:min(440px,100%);background:var(--surface);border-radius:14px;border:1px solid var(--line2);padding:20px;margin-top:6vh}
.modal label,.form label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}.modal .inp,.modal .sel,.form .inp,.form .sel{width:100%}
.err{color:var(--down);font-size:12px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;z-index:90;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.s{opacity:1}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth .l{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth .l h1{font-size:38px;color:#fff;max-width:14ch}.auth .l p{color:#B8C6DD;margin-top:10px;font-size:16px}
.auth .l .logo{color:#fff}.auth .l .rail{color:#B8C6DD}.auth .l .rail .tr{background:#0F2747}.auth .l .rail .tr i{background:#284063}.auth .l .rail .tr i.o{background:#6A90FF}
.auth .r{display:grid;place-items:center;padding:32px 20px}.auth .form{width:min(400px,100%)}
.steps{display:flex;gap:6px;margin:14px 0 6px;padding:0;list-style:none;font-size:12px;color:var(--faint)}
.steps li{flex:1;border-top:3px solid var(--line2);padding-top:6px}.steps li.on{border-color:var(--blue);color:var(--text);font-weight:600}.steps li.dn{border-color:var(--up)}
footer.ft{margin-top:40px;border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:2fr repeat(3,1fr);gap:20px;font-size:13px;color:var(--muted)}
footer.ft a{display:block;color:var(--muted);padding:2px 0}footer.ft b{color:var(--text);display:block;margin-bottom:4px}
.bnav{display:none}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g13{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.nav{display:none}.side:not(.open){width:var(--side-c)}.side:not(.open) h4{visibility:hidden;height:1px;margin:8px 0}.side:not(.open) a span,.side:not(.open) a em,.side:not(.open) .who div{display:none}.side:not(.open) a{justify-content:center}}
@media (max-width:760px){
  h1{font-size:24px}.hero h1{font-size:28px}.main{padding:14px 12px 96px}.hdr{padding:0 12px}.logo span,.hide-m{display:none}
  .g2,.g3,.g21{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.regions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side,.side:not(.open){display:none}.side.open{display:flex;position:fixed;top:0;left:0;bottom:0;height:auto;width:var(--side);z-index:70;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--muted)}.bnav a.on{color:var(--blue-ink)}
  .hm,.hm.cmp{aspect-ratio:1/1.1}.rail{grid-template-columns:92px 1fr}.rail>.st{display:none}.br{grid-template-columns:110px 1fr 58px}
  .auth{grid-template-columns:1fr}.auth .l{padding:24px}.auth .l .rail{display:none}.auth .l h1{font-size:26px}footer.ft{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function walk(seed,n,chg,sd){const r=rng(seed);const w=[0];for(let i=1;i<n;i++)w.push(w[i-1]+(r()+r()+r()-1.5)*sd);const s=-Math.log(1+chg/100);return w.map((x,i)=>Math.exp(x-w[n-1]*i/(n-1)+s*(1-i/(n-1))))}
const RG={'1D':[78,'d1'],'5D':[60,'w1'],'1M':[22,'m1'],'3M':[66,'m3'],'6M':[126,'m6'],YTD:[192,'ytd'],'1Y':[252,'y1'],'3Y':[156,'y3'],'5Y':[260,'y5'],MAX:[300,'y5']};
function series(a,range){const [n,k]=RG[range];const chg=range==='MAX'?a.y5*1.6:a[k];const sd=Math.abs(chg)/100/Math.sqrt(n)*1.2+.004;const c=walk(a.t+range,n,chg,sd).map(x=>x*a.price);const r=rng(a.t+range+'o');
  return c.map((x,i)=>{const o=i?c[i-1]:x*(1+(r()-.5)*sd);const hi=Math.max(o,x)*(1+r()*sd*.7),lo=Math.min(o,x)*(1-r()*sd*.7);return{o,h:hi,l:lo,c:x,v:a.vol/(range==='1D'?78:1)*(.5+r())}})}
function dlabel(range,i,n){if(range==='1D'){const m=570+i*5;return hhmm(m/60)}const step={'5D':1/12,'1M':1.45,'3M':1.45,'6M':1.45,YTD:1.45,'1Y':1.45,'3Y':7,'5Y':7,MAX:12}[range];const d=new Date(2026,9,6);d.setDate(d.getDate()-Math.round((n-1-i)*step));return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:step>=1.45&&n>60?'2-digit':undefined})}
const spark=(seed,chg,w=160,h=30)=>{const p=walk(seed,24,chg||.01,.006),mn=Math.min(...p),mx=Math.max(...p);return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${chg>=0?'var(--up)':'var(--down)'}" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${p.map((v,i)=>`${(i/23*w).toFixed(1)},${(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1)}`).join(' ')}"/></svg>`};
const sma=(c,n)=>c.map((_,i)=>i<n-1?null:c.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);
const ema=(c,n)=>{const k=2/(n+1);let e=c[0];return c.map(x=>e=x*k+e*(1-k))};
function rsiS(c,n=14){const out=[];let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];const up=Math.max(d,0),dn=Math.max(-d,0);if(i<=n){g+=up/n;l+=dn/n}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n}out.push(i<n?null:100-100/(1+g/(l||1e-9)))}return[null,...out]}

function atable(list,cols=['price','d1','w1','y1','mcap','pe','dy','status'],o={}){if(!list.length)return `<div class="state"><b>${o.empty||'No assets match'}</b>${o.emptySub||'Loosen a filter or change the universe.'}</div>`;

function squarify(items,x,y,w,h){const tot=items.reduce((s,i)=>s+i.v,0)||1;let rest=items.map(i=>({...i,A_:i.v/tot*w*h}));const out=[];
  while(rest.length){const sh=Math.min(w,h)||1e-6;const worst=r=>{const s=r.reduce((a,b)=>a+b.A_,0),mx=Math.max(...r.map(b=>b.A_)),mn=Math.min(...r.map(b=>b.A_));return Math.max(sh*sh*mx/(s*s),s*s/(sh*sh*mn))};
    let row=[rest[0]],i=1;while(i<rest.length&&worst([...row,rest[i]])<=worst(row))row.push(rest[i++]);const s=row.reduce((a,b)=>a+b.A_,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(r=>{out.push({...r,x,y:cy,w:cw,h:r.A_/cw});cy+=r.A_/cw});x+=cw;w-=cw}else{const rh=s/w;let cx=x;row.forEach(r=>{out.push({...r,x:cx,y,w:r.A_/rh,h:rh});cx+=r.A_/rh});y+=rh;h-=rh}
    rest=rest.slice(i)}return out}
const DIMS={region:['region','country','sector'],country:['country','sector'],sector:['sector','industry'],type:['type','sector']};

function hmCol(v,metric){const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));const n=[92,104,124];if(metric==='volat'){const t=Math.min(1,Math.max(0,(v-12)/33));return `rgb(${mix([120,134,160],[23,62,190],t)})`}
  if(!v)return `rgb(${n})`;const t=Math.min(1,Math.abs(v)/HMR[metric]);return `rgb(${mix(n,v>=0?[11,122,82]:[190,50,42],.25+t*.75)})`}
const hmUni=cfg=>A.filter(a=>cfg.uni==='all'||a.type===cfg.uni);

  <div class="legend" style="margin-top:8px">${cfg.metric==='volat'?`Lower volatility<i style="background:${hmCol(12,'volat')}"></i><i style="background:${hmCol(28,'volat')}"></i><i style="background:${hmCol(45,'volat')}"></i>Higher`:`−${HMR[cfg.metric]}%<i style="background:${hmCol(-HMR[cfg.metric],cfg.metric)}"></i><i style="background:${hmCol(-HMR[cfg.metric]/3,cfg.metric)}"></i><i style="background:${hmCol(0,cfg.metric)}"></i><i style="background:${hmCol(HMR[cfg.metric]/3,cfg.metric)}"></i><i style="background:${hmCol(HMR[cfg.metric],cfg.metric)}"></i>+${HMR[cfg.metric]}%`}<span style="margin-left:auto">Each tile shows its signed value, so colour is never the only cue.</span></div>`}

function chart(a,cs){const d=series(a,cs.range),c=d.map(x=>x.c),n=d.length,W=1000,PR=62,H=320,VH=cs.vol?56:0,RH=cs.rsi?84:0,TH=H+VH+RH+22;
  const bb=cs.bb?sma(c,20).map((m,i)=>{if(m==null)return null;const sl=c.slice(i-19,i+1),sd=Math.sqrt(sl.reduce((s,x)=>s+(x-m)**2,0)/20);return[m-2*sd,m+2*sd]}):null;
  let mn=Math.min(...d.map(x=>x.l)),mx=Math.max(...d.map(x=>x.h));if(bb)bb.forEach(b=>{if(b){mn=Math.min(mn,b[0]);mx=Math.max(mx,b[1])}});const pad=(mx-mn)*.06;mn-=pad;mx+=pad;
  const X=i=>i/(n-1)*(W-PR),Y=v=>8+(1-(v-mn)/(mx-mn))*(H-16),up=c[n-1]>=c[0],col=up?'var(--up)':'var(--down)';
  const path=(arr,f=Y)=>{let s='',pen=false;arr.forEach((v,i)=>{if(v==null){pen=false;return}s+=(pen?'L':'M')+X(i).toFixed(1)+' '+f(v).toFixed(1);pen=true});return s};
  let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="0" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W-PR+8}" y="${Y(v)+4}">${fmt(v,dp(a))}</text>`}
  for(let k=0;k<5;k++){const i=Math.round(k*(n-1)/4);g+=`<text x="${X(i)}" y="${TH-6}" text-anchor="${k==0?'start':k==4?'end':'middle'}">${dlabel(cs.range,i,n)}</text>`}
  let body='';if(cs.type==='candle'){const bw=Math.max(1.2,(W-PR)/n*.62);body=d.map((x,i)=>{const u=x.c>=x.o,cl=u?'var(--up)':'var(--down)';return `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(x.h)}" y2="${Y(x.l)}" stroke="${cl}"/><rect x="${X(i)-bw/2}" y="${Y(Math.max(x.o,x.c))}" width="${bw}" height="${Math.max(1,Math.abs(Y(x.o)-Y(x.c)))}" fill="${u?'var(--surface)':cl}" stroke="${cl}"/>`}).join('')}
  else body=(cs.type==='area'?`<path d="${path(c)}L${W-PR} ${H}L0 ${H}Z" fill="${col}" opacity=".09"/>`:'')+`<path d="${path(c)}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
  if(bb)body+=`<path d="${path(bb.map(b=>b&&b[0]))}" fill="none" stroke="var(--faint)" stroke-dasharray="3 3"/><path d="${path(bb.map(b=>b&&b[1]))}" fill="none" stroke="var(--faint)" stroke-dasharray="3 3"/>`;
  if(cs.sma)body+=`<path d="${path(sma(c,20))}" fill="none" stroke="var(--blue)" stroke-width="1.4"/>`;if(cs.ema)body+=`<path d="${path(ema(c,50))}" fill="none" stroke="var(--saffron)" stroke-width="1.4" stroke-dasharray="6 3"/>`;
  if(cs.vol){const vm=Math.max(...d.map(x=>x.v)),bw=Math.max(1,(W-PR)/n*.6);body+=d.map((x,i)=>`<rect x="${X(i)-bw/2}" y="${H+VH-x.v/vm*(VH-8)}" width="${bw}" height="${x.v/vm*(VH-8)}" fill="var(--line2)"/>`).join('')+`<text x="${W-PR+8}" y="${H+14}">Volume</text>`}
  if(cs.rsi){const y0=H+VH+6,RY=v=>y0+(1-v/100)*(RH-12);body+=`<line x1="0" x2="${W-PR}" y1="${RY(70)}" y2="${RY(70)}" stroke="var(--line2)" stroke-dasharray="2 3"/><line x1="0" x2="${W-PR}" y1="${RY(30)}" y2="${RY(30)}" stroke="var(--line2)" stroke-dasharray="2 3"/><path d="${path(rsiS(c),RY)}" fill="none" stroke="var(--blue)" stroke-width="1.3"/><text x="${W-PR+8}" y="${RY(70)+4}">RSI 70</text><text x="${W-PR+8}" y="${RY(30)+4}">30</text>`}
  chart.cur={d,n,W,PR,a,range:cs.range,Y};const chg=(c[n-1]/c[0]-1)*100;

/* ============ shell ============ */
function shell(inner,r){const on=k=>r[0]===k||(k==='home'&&!r[0])?'on':'';const open=MK.filter(m=>m.ses==='Open').length;
  const side=S.signedIn?`<aside class="side ${S.collapsed?'c':''} ${S.drawer?'open':''}" aria-label="Personal workspace"><nav>${WS.map(g=>`<h4>${g[0]}</h4>${g[1].map(i=>{const c=wsCount(i[0]),act=r[0]==='app'&&(r[1]||'')===i[0];return `<a href="#/app${i[0]?'/'+i[0]:''}" class="${act?'on':''}" ${act?'aria-current="page"':''} title="${i[1]}">${ic(i[2])}<span>${i[1]}</span>${c?`<em class="${i[0]==='alerts'&&S.alerts.some(a=>a.status==='Triggered')?'unread':''}">${c}</em>`:''}</a>`}).join('')}`).join('')}</nav><div class="bot"><a href="#/app/settings" class="${r[1]==='settings'?'on':''}" title="Settings">${ic('gear')}<span>Settings</span></a><a href="#/app/help" class="${r[1]==='help'?'on':''}" title="Help">${ic('help')}<span>Help</span></a><div class="who"><span class="av">AM</span><div><b>Aarav Mehta</b><br><span class="sm faint">Demo account</span></div></div></div></aside>`:'';
  return `<div class="demo"><b>Prototype</b><span>Demo data snapshot, ${NOW.date} ${NOW.ist} IST. Not current market prices.</span><span class="sp"></span><label>Preview data state <select data-c="ds" aria-label="Preview data state">${['AUTO','LIVE','DELAYED','EOD','CLOSED','UNAVAILABLE','ERROR','LOADING'].map(d=>`<option value="${d}" ${S.ds===d?'selected':''}>${d==='AUTO'?'Per market (default)':DSL[d]}</option>`).join('')}</select></label></div>
  <header class="hdr">${S.signedIn?`<button class="ib" data-a="side" aria-label="Toggle workspace sidebar" aria-expanded="${!S.collapsed}">${ic('side')}</button>`:''}<a class="logo" href="#/" aria-label="INRGIFT home"><i></i><span>INRGIFT</span></a>
  <nav class="nav" aria-label="Primary"><a class="${on('markets')}" href="#/markets">Markets</a><a class="${on('assets')||on('stocks')||on('etfs')}" href="#/assets">Assets</a><details class="dd"><summary class="${on('screener')||on('compare')||on('heatmap')}">Discover</summary><div class="menu"><a href="#/screener">Screener<small>Filter stocks and ETFs worldwide</small></a><a href="#/heatmap">Heatmap<small>Region, market and sector drill-down</small></a><a href="#/compare">Compare<small>Up to four assets side by side</small></a><a href="#/collection/ai-semis">Collections<small>Curated themes</small></a></div></details><a class="${on('research')}" href="#/research">Research</a><details class="dd"><summary class="${on('data')||on('next')}">Resources</summary><div class="menu"><a href="#/data">Data and methodology<small>Statuses, sources and scores</small></a><a href="#/next">Calendars, news and learning<small>Planned for the next phase</small></a></div></details></nav>
  <button class="srch" data-a="search" aria-label="Search anything">${ic('search')}<span>Search anything…</span><kbd class="hide-m">Ctrl K</kbd></button>
  <div class="hr"><select class="sel hide-m" data-c="ccy" aria-label="Display currency" style="width:auto"><option value="LOCAL" ${S.ccy==='LOCAL'?'selected':''}>Local</option><option value="INR" ${S.ccy==='INR'?'selected':''}>INR ₹</option></select><a class="ib hide-m" href="#/markets" title="Market status">${ic('globe')}<span class="sm">${open} open</span></a>
  ${S.signedIn?`<details class="dd"><summary class="ib" aria-label="Notifications${S.notif?', '+S.notif+' unread':''}">${ic('bell')}${S.notif?'<span class="dot"></span>':''}</summary><div class="menu rt" style="min-width:290px"><a href="#/app/alerts" data-a="readN">SPY moved more than 2% in a day<small>Alert triggered · 01 Oct, 20:14 IST</small></a><a href="#/markets/cn" data-a="readN">China markets closed for holiday<small>Market event · reopens 08 Oct</small></a></div></details><details class="dd"><summary class="ib" aria-label="Account menu"><span class="av">AM</span></summary><div class="menu rt"><a href="#/app">Workspace overview</a><a href="#/app/settings">Settings</a><button data-a="logout">Sign out</button></div></details>`:`<a class="btn hide-m" href="#/login">Sign in</a><a class="btn p" href="#/signup">Create account</a>`}</div></header>
  <div class="shell">${side}<main class="main" id="main">${inner}</main></div>
  <nav class="bnav" aria-label="Mobile">${[['','Home','home','home'],['markets','Markets','globe','markets'],['screener','Discover','compass','screener'],['research','Research','doc','research'],[S.signedIn?'app':'login','Workspace','user','app']].map(b=>`<a href="#/${b[0]}" class="${on(b[3])}">${ic(b[2])}${b[1]}</a>`).join('')}</nav>`}
function modal(){const m=S.modal;if(!m)return'';if(m.k==='alert'){const a=AS[m.t];return `<div class="ov" data-a="closeM" data-self="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Create alert</h2><label for="at">Asset</label><select id="at" class="sel">${A.map(x=>`<option value="${x.t}" ${x.t===a.t?'selected':''}>${x.name} (${x.t})</option>`).join('')}</select><label for="ak">Condition</label><select id="ak" class="sel">${['Price above','Price below','Daily move beyond','52-week high','52-week low','Earnings date','Dividend declared','News published'].map(x=>`<option>${x}</option>`).join('')}</select><label for="av">Value <span class="faint" style="font-weight:400">(price in ${a.ccy} or a percentage; leave blank for event alerts)</span></label><input id="av" class="inp" inputmode="decimal" placeholder="${fmt(a.price*1.05,dp(a))}"><p class="sm faint" style="margin-top:8px">Alerts notify you. They never place an order.</p><div class="chips" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-a="closeM">Cancel</button><button class="btn p" data-a="alertAdd">Create alert</button></div></div></div>`}
  return `<div class="ov" data-a="closeM" data-self="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">New note</h2><label for="nt">Title</label><input id="nt" class="inp"><label for="nb">Note</label><textarea id="nb" class="inp" rows="4"></textarea><label for="na">Linked asset</label><select id="na" class="sel"><option value="">None</option>${A.map(x=>`<option value="${x.t}" ${x.t===m.t?'selected':''}>${x.name} (${x.t})</option>`).join('')}</select>${S.err.note?`<p class="err" role="alert">${S.err.note}</p>`:''}<div class="chips" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-a="closeM">Cancel</button><button class="btn p" data-a="noteAdd">Save note</button></div></div></div>`}

/* ============ search palette ============ */
const SR={open:false,q:'',i:0,items:[]};
function sresults(q){q=q.trim().toLowerCase();const g=[];if(!q){g.push(['Recent',S.recent.slice(0,4).map(t=>[AS[t].name,href(AS[t]),t])]);g.push(['Markets',['in','us','jp'].map(k=>[M[k].name,'#/markets/'+k,M[k].ses])]);g.push(['Collections',COLL.slice(0,3).map(c=>[c.name,'#/collection/'+c.id,'Collection'])]);return g}
  const rank=a=>a.t.toLowerCase()===q?0:a.name.toLowerCase()===q?1:a.t.toLowerCase().startsWith(q)?2:a.name.toLowerCase().startsWith(q)?3:(a.name+' '+a.t+' '+M[a.mk].ex).toLowerCase().includes(q)?4:(a.sector+' '+a.industry).toLowerCase().includes(q)?5:9;
  const as=A.map(a=>[rank(a),a]).filter(x=>x[0]<9).sort((x,y)=>x[0]-y[0]||y[1].mcap-x[1].mcap).slice(0,6).map(([,a])=>[a.name,href(a),`${a.t} · ${M[a.mk].ex.split(' · ')[0]} · ${a.type==='etf'?'ETF':'Stock'}`]);
  const ix=IDX.filter(i=>i.name.toLowerCase().includes(q)).slice(0,3).map(i=>[i.name,'#/markets/'+i.mk,'Index · '+M[i.mk].name]);
  const mk=MK.filter(m=>(m.name+' '+m.ex+' '+m.region+' '+m.ccy).toLowerCase().includes(q)).slice(0,4).map(m=>[m.name,'#/markets/'+m.id,m.ex]);
  const rs=RES.filter(r=>(r.title+r.t).toLowerCase().includes(q)).slice(0,3).map(r=>[r.title,href(AS[r.t]),'Research']);
  const nw=NEWS.filter(n=>(n.head+n.t+AS[n.t].name).toLowerCase().includes(q)).slice(0,3).map(n=>[AS[n.t].name+': '+n.head,href(AS[n.t]),'News']);
  const co=COLL.filter(c=>(c.name+c.d).toLowerCase().includes(q)).map(c=>[c.name,'#/collection/'+c.id,'Collection']);
  [['Assets',[...as,...ix]],['Markets',mk],['Research',rs],['News',nw],['Collections',co]].forEach(x=>x[1].length&&g.push(x));return g}
function drawSearch(){const el=document.getElementById('sres');if(!el)return;const g=sresults(SR.q);SR.items=g.flatMap(x=>x[1]);SR.i=Math.min(SR.i,Math.max(0,SR.items.length-1));let n=0;
  el.innerHTML=SR.items.length?g.map(x=>`<h5>${x[0]}</h5>${x[1].map(it=>`<a href="${it[1]}" class="${n===SR.i?'act':''}" data-i="${n++}" role="option" aria-selected="${n-1===SR.i}">${esc(it[0])}<small>${esc(it[2])}</small></a>`).join('')}`).join(''):`<div class="state"><b>No results for "${esc(SR.q)}"</b>Try a ticker such as NVDA, a company name, a market such as Japan, or a theme.</div>`;
  el.querySelector('.act')?.scrollIntoView?.({block:'nearest'})}
function openSearch(){SR.open=true;SR.q='';SR.i=0;document.getElementById('ov').innerHTML=`<div class="ov" id="sov"><div class="pal" role="dialog" aria-modal="true" aria-label="Search"><input id="sq" type="text" role="combobox" aria-expanded="true" aria-controls="sres" autocomplete="off" placeholder="Search assets, markets, research, news, collections"><div class="res" id="sres" role="listbox"></div><div class="mf"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div></div>`;drawSearch();const q=document.getElementById('sq');q.focus();
  q.addEventListener('input',()=>{SR.q=q.value;SR.i=0;drawSearch()});
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){SR.i=Math.min(SR.items.length-1,SR.i+1);drawSearch();e.preventDefault()}else if(e.key==='ArrowUp'){SR.i=Math.max(0,SR.i-1);drawSearch();e.preventDefault()}else if(e.key==='Enter'&&SR.items[SR.i]){const h=SR.items[SR.i][1];closeSearch();location.hash=h}});
  document.getElementById('sov').addEventListener('click',e=>{if(e.target.id==='sov'||e.target.closest('a'))closeSearch()})}
function closeSearch(){SR.open=false;document.getElementById('ov').innerHTML=''}

/* ============ router + actions ============ */
const route=()=>location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
let lastHash=null;
function render(){const r=route(),k=r[0]||'home';
  if(k==='app'&&!S.signedIn){location.hash='#/login';return}
  if((k==='stocks'||k==='etfs')&&AS[r[1]]&&lastHash!==location.hash){S.recent=[r[1],...S.recent.filter(t=>t!==r[1])].slice(0,12)}
  const page=k==='home'?P.home():k==='markets'?(r[1]?P.market(r[1]):P.markets()):k==='stocks'?P.stock(r[1]):k==='etfs'?P.etf(r[1]):k==='collection'?P.collection(r[1]):k==='app'?P.app(r[1]):Object.hasOwn(P,k)&&!['market','stock','etf','nf'].includes(k)?P[k]():P.nf();
  const auth=k==='login'||k==='signup';
  document.getElementById('app').innerHTML=(auth?page:shell(page,r))+modal();
  const ttl={home:'Global market intelligence from India',markets:r[1]&&M[r[1]]?M[r[1]].name+' market':'Global markets',stocks:AS[r[1]]?.name,etfs:AS[r[1]]?.name,heatmap:'Global heatmap',assets:'Explore global assets',screener:'Global screener',compare:'Compare',login:'Sign in',signup:'Create account',app:'Workspace',research:'Research',data:'Data and methodology'}[k]||'INRGIFT';
  document.title=ttl+' · INRGIFT (prototype)';
  if(lastHash!==location.hash){window.scrollTo(0,0);lastHash=location.hash}
  bindChart();if(S.modal)document.querySelector('.modal input,.modal select')?.focus()}
function bindChart(){const svg=document.getElementById('csvg');if(!svg||!chart.cur)return;const {d,n,W,PR,a,range,Y}=chart.cur,cx=document.getElementById('cx'),cd=document.getElementById('cd'),ro=document.getElementById('cro'),base=ro.innerHTML;
  const mv=e=>{const b=svg.getBoundingClientRect(),px=((e.touches?e.touches[0].clientX:e.clientX)-b.left)/b.width*W,i=Math.max(0,Math.min(n-1,Math.round(px/(W-PR)*(n-1)))),x=i/(n-1)*(W-PR),p=d[i];
    cx.setAttribute('x1',x);cx.setAttribute('x2',x);cx.setAttribute('visibility','visible');cd.setAttribute('cx',x);cd.setAttribute('cy',Y(p.c));cd.setAttribute('visibility','visible');
    ro.innerHTML=`<b>${dlabel(range,i,n)}</b> · O ${fmt(p.o,dp(a))} · H ${fmt(p.h,dp(a))} · L ${fmt(p.l,dp(a))} · C <b>${fmt(p.c,dp(a))}</b> ${a.ccy} · Vol ${big(p.v)} · ${pct((p.c/d[0].c-1)*100)} since start`};
  svg.addEventListener('mousemove',mv);svg.addEventListener('touchmove',mv,{passive:true});svg.addEventListener('mouseleave',()=>{cx.setAttribute('visibility','hidden');cd.setAttribute('visibility','hidden');ro.innerHTML=base})}
const parentOf=p=>{const a=p.split('.'),i=+a.pop();return[node(a.join('.')),i]};
const ACT={
  search:()=>openSearch(),go:v=>{location.hash=v},retry:()=>{S.ds='AUTO';toast('Data reloaded')},
  side:()=>{if(window.innerWidth<=1180)S.drawer=!S.drawer;else S.collapsed=!S.collapsed},
  watch:v=>{S.watch.has(v)?(S.watch.delete(v),toast(v+' removed from watchlist')):(S.watch.add(v),toast(v+' added to watchlist'))},
  addCmp:(v,el)=>{if(S.compare.includes(v)){if(!el.dataset.go)toast(v+' is already in compare')}else if(S.compare.length>=4){toast('Compare holds four assets. Remove one first.');if(!el.dataset.go)return}else{S.compare.push(v);toast(v+' added to compare ('+S.compare.length+' of 4)')}if(el.dataset.go)location.hash='#/compare'},
  cmpDel:v=>{S.compare=S.compare.filter(t=>t!==v)},cmpR:v=>{S.cmpR=v},cmpSave:()=>{S.comparisons.unshift([...S.compare]);toast('Comparison saved to your workspace')},cmpLoad:v=>{S.compare=[...S.comparisons[v]]},cmpRm:v=>{S.comparisons.splice(v,1)},
  alertM:v=>{if(!S.signedIn){location.hash='#/login';return}S.modal={k:'alert',t:v}},noteM:v=>{if(!S.signedIn){location.hash='#/login';return}S.err={};S.modal={k:'note',t:v}},
  closeM:(v,el,e)=>{if(el.dataset.self&&e.target!==el)return 'skip';S.modal=null},
  alertAdd:()=>{const g=id=>document.getElementById(id).value;S.alerts.unshift({t:g('at'),type:g('ak'),v:g('av').trim(),status:'Active',created:NOW.date,last:'Not yet triggered'});S.modal=null;toast('Alert created')},
  alertRm:v=>{S.alerts.splice(v,1);toast('Alert deleted')},
  noteAdd:()=>{const g=id=>document.getElementById(id).value.trim();if(!g('nt')){S.err.note='Give the note a title so you can find it later.';return}S.notes.unshift({title:g('nt'),body:g('nb'),t:g('na'),ts:NOW.date});S.modal=null;toast('Note saved')},noteRm:v=>{S.notes.splice(v,1)},
  saveRes:v=>{S.saved.includes(v)?S.saved=S.saved.filter(t=>t!==v):(S.saved.unshift(v),toast('Saved to your research'))},
  sort:v=>{S.sort=S.sort.k===v?{k:v,d:-S.sort.d}:{k:v,d:-1}},tab:v=>{S.tab=v},
  crange:v=>{S.chart.range=v},ctype:v=>{S.chart.type=v},cind:v=>{S.chart[v]=!S.chart[v]},
  mkf:v=>{S.mkf.region=v},uni:v=>{S.scr.uni=v},
  hmSet:v=>{const [k,x]=v.split('|');S.hm[k]=x;if(k==='group'||k==='uni'){S.hm.path=[];S.hm.sel=null}},
  hmDrill:(v,el)=>{if(el.dataset.go){const j=JSON.parse(el.dataset.go);S.hm={...S.hm,group:j.g,path:j.p,uni:'all',sel:null};location.hash='#/heatmap';return}S.hm.path.push(v);S.hm.sel=null},
  hmUp:v=>{S.hm.path=S.hm.path.slice(0,+v);S.hm.sel=null},hmPreset:v=>{const [g,x]=v.split('|');S.hm={...S.hm,group:g,path:[x],uni:'all',sel:null}},
  hmSel:(v,el)=>{S.hm.sel=v;document.querySelectorAll('.ht.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');document.getElementById('hmq').innerHTML=hmQuick(AS[v]);return 'skip'},
  scrOp:v=>{const [p,o]=v.split('|');node(p).op=o},scrAdd:v=>{node(v).rules.push({f:'pe',o:'<=',v:30})},scrAddG:v=>{node(v).rules.push({op:'OR',rules:[{f:'y1',o:'>=',v:20}]})},
  scrDel:v=>{const [par,i]=parentOf(v);par.rules.splice(i,1)},scrCol:v=>{const c=S.scr.cols;c.includes(v)?c.splice(c.indexOf(v),1):c.push(v);S.scr.cols=Object.keys(COLS).filter(k=>c.includes(k))},
  scrReset:()=>{S.scr.tree={op:'AND',rules:[]};S.scr.uni='all';S.scr.name=''},
  scrSave:()=>{const sc=S.scr,name=sc.name.trim()||'Untitled screen '+(S.screens.length+1);S.screens.unshift({name,uni:sc.uni,tree:JSON.stringify(sc.tree),count:A.filter(a=>(sc.uni==='all'||a.type===sc.uni)&&ev(sc.tree,a)).length});toast('"'+name+'" saved to your workspace')},
  scrLoad:v=>{const s=S.screens[v];S.scr.tree=JSON.parse(s.tree);S.scr.uni=s.uni;S.scr.name=s.name},scrDup:v=>{S.screens.splice(+v+1,0,{...S.screens[v],name:S.screens[v].name+' copy'})},scrRm:v=>{S.screens.splice(v,1)},
  scrMarket:v=>{S.scr.uni='all';S.scr.tree={op:'AND',rules:[{f:'country',o:'is',v}]}},scrSector:v=>{S.scr.uni='stock';S.scr.tree={op:'AND',rules:[{f:'sector',o:'is',v}]}},
  scrSort:v=>{const [k,d]=v.split('|');S.scr.uni=k==='revG'?'stock':'all';S.scr.tree={op:'AND',rules:[]};S.sort={k,d:+d};if(!S.scr.cols.includes(k)&&COLS[k])S.scr.cols.push(k)},
  clearHist:()=>{S.recent=[];toast('History cleared')},readN:()=>{S.notif=0},theme:v=>{v?document.documentElement.dataset.theme=v:delete document.documentElement.dataset.theme},
  login:()=>{const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value;if(!/^\S+@\S+\.\S+$/.test(e)){S.err.login='Enter a valid email address, such as you@example.com.';return}if(!p){S.err.login='Enter your password.';return}S.err={};S.signedIn=true;location.hash='#/app'},
  demoLogin:()=>{S.err={};S.signedIn=true;location.hash='#/app'},logout:()=>{S.signedIn=false;S.drawer=false;location.hash='#/';toast('Signed out')},
  suNext:()=>{const g=id=>document.getElementById(id),u=S.su;u.name=g('sn').value.trim();u.email=g('se').value.trim();const p=g('sp').value;
    S.err.su=!u.name?'Enter your full name.':!/^\S+@\S+\.\S+$/.test(u.email)?'Enter a valid email address.':p.length<10||!/\d/.test(p)||!/[^\w\s]/.test(p)?'Password needs at least 10 characters, a number and a symbol.':p!==g('sp2').value?'The two passwords do not match.':!g('stc').checked?'Tick the box to accept the terms.':'';if(!S.err.su)u.step=2},
  suStep:v=>{S.su.step=+v;S.err={}},suResend:()=>{toast('Verification email sent again');return 'skip'},suPick:v=>{const [s,x]=v.split('|');S.su[s].has(x)?S.su[s].delete(x):S.su[s].add(x)},
  suDone:()=>{S.ccy=S.su.ccy;S.signedIn=true;S.su.step=1;location.hash='#/app'}};
const CHG={ds:v=>{S.ds=v},ccy:v=>{S.ccy=v},suCcy:v=>{S.su.ccy=v},scrName:v=>{S.scr.name=v;return 'skip'},cmpAdd:v=>{if(v&&S.compare.length<4)S.compare.push(v)},
  scrF:(v,p)=>{const n=node(p),cat=FD[v][1]==='cat';n.f=v;n.o=cat?'is':'>=';n.v=cat?[...new Set(A.map(a=>a[v]))].sort()[0]:0},scrO:(v,p)=>{node(p).o=v},scrV:(v,p)=>{node(p).v=v}};
document.addEventListener('click',e=>{const dds=document.querySelectorAll('details.dd[open]');dds.forEach(d=>{if(!d.contains(e.target)||e.target.closest('.menu a'))d.removeAttribute('open')});
  const el=e.target.closest('[data-a]');if(!el){if(S.drawer&&!e.target.closest('.side')){S.drawer=false;render()}return}
  const isLink=el.tagName==='A'&&el.getAttribute('href');const before=location.hash;const r=ACT[el.dataset.a]?.(el.dataset.v,el,e);
  if(isLink){if(el.dataset.a==='tab')S.keepTab=el.getAttribute('href')!==before;if(el.getAttribute('href')===before){e.preventDefault();render()}return}
  if(r!=='skip'&&location.hash===before&&el.dataset.a!=='search')render()});
document.addEventListener('dblclick',e=>{const t=e.target.closest('.ht[data-a="hmSel"]');if(t)location.hash=href(AS[t.dataset.v])});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el)return;if(CHG[el.dataset.c](el.value,el.dataset.v)!=='skip')render()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();SR.open?closeSearch():openSearch()}else if(e.key==='Escape'){if(SR.open)closeSearch();else if(S.modal){S.modal=null;render()}else if(S.chart.fs){S.chart.fs=false;render()}else if(S.drawer){S.drawer=false;render()}}});
window.addEventListener('hashchange',()=>{S.drawer=false;S.modal=null;if(!/^#\/(stocks|etfs)\//.test(location.hash))S.chart.fs=false;if(!S.keepTab)S.tab='overview';S.keepTab=false;render()});
render();
</script>
