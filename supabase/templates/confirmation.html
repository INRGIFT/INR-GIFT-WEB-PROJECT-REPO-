<!-- Supabase Auth → Email Templates → "Confirm signup". Subject: Confirm your email for INRGIFT -->
<!-- Official logo (brand library v1.0, horizontal lockup at its 220 px minimum), served from the production domain. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;padding:24px;color:#071A33">
  <p style="margin:0 0 24px"><img src="{{ .SiteURL }}/brand/email/INRGIFT_Web_Header_Desktop_Light@2x.png" width="220" height="56" alt="INRGIFT — Invest Beyond Borders" style="display:block;border:0"></p>
  <h1 style="font-size:20px;margin:0 0 12px">Confirm your email</h1>
  <p style="font-size:15px;line-height:1.5;color:#4A5770;margin:0 0 20px">Confirm {{ .Email }} to finish creating your INRGIFT research account.</p>
  <p style="margin:0 0 20px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/verify-phone" style="display:inline-block;background:#245BFE;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 18px;border-radius:8px">Confirm email</a></p>
  <p style="font-size:13px;line-height:1.5;color:#6F7C93;margin:0">If you did not sign up for INRGIFT, ignore this email. INRGIFT is a research service; it never asks for bank, card or trading details.</p>
</div>
